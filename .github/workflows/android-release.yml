name: Build Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    - name: Restore Dependencies
      run: dotnet restore JobPilot.sln

    - name: Decode Android Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > keystore_base64.txt
        certutil -decode keystore_base64.txt jobpilot-release-key.keystore

    - name: Publish Android App Bundle (.aab)
      run: |
        dotnet publish JobPilot/JobPilot.csproj -c Release -f net10.0-android /p:AndroidPackageFormat=aab /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=jobpilot-release-key.keystore /p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} /p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} /p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: jobpilot-release-aab
        path: JobPilot/bin/Release/net10.0-android/*-Signed.aab
