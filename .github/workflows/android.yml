name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Personal data check
        run: bash scripts/check-no-personal-data.sh

      - name: No signing material in the repo
        run: bash android/scripts/check-no-signing-keys.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK components required by the project
        run: >
          dotnet build android/src/JobPilot.Mobile -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore
        run: dotnet restore android/JobPilot.Mobile.slnx

      - name: Build (warnings are errors)
        run: dotnet build android/JobPilot.Mobile.slnx -c Release --no-restore -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Test
        run: dotnet test --solution android/JobPilot.Mobile.slnx -c Release --no-build

      # The signed APK is built only on pushes and only when the owner has stored the signing secrets
      # (see android/README.md). The keystore is written to the runner's temp folder and never to the workspace.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed APK skipped: it is built on pushes once the ANDROID_* signing secrets are set."
          fi

      - name: Build the signed APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/jobpilot.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          dotnet publish android/src/JobPilot.Mobile -f net10.0-android -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_SIGNING_STORE_PASS \
            -p:AndroidSigningKeyPass=env:ANDROID_SIGNING_KEY_PASS \
            -o "$RUNNER_TEMP/apk"
          rm -f "$keystore"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/apk/com.vidi.jobpilot-Signed.apk" "$RUNNER_TEMP/out/JobPilot-${{ github.run_number }}.apk"

      - name: Upload the signed APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-android-${{ github.run_number }}
          path: ${{ runner.temp }}/out/JobPilot-${{ github.run_number }}.apk
          retention-days: 30
          if-no-files-found: error
