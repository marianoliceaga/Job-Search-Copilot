name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    # Write access only to publish the signed APK as a release on main (see the last step).
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Personal data check
        run: bash scripts/check-no-personal-data.sh

      - name: No signing material in the repo
        run: bash android/scripts/check-no-signing-keys.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK components required by the project
        run: >
          dotnet build android/src/JobPilot.Mobile -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore
        run: dotnet restore android/JobPilot.Mobile.slnx

      - name: Build (warnings are errors)
        run: dotnet build android/JobPilot.Mobile.slnx -c Release --no-restore -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Test
        run: dotnet test --solution android/JobPilot.Mobile.slnx -c Release --no-build

      # The signed APK is built only on pushes and only when the owner has stored the signing secrets
      # (see android/README.md). The keystore is written to the runner's temp folder and never to the workspace.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; } && [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed APK skipped: it is built on pushes once the ANDROID_* signing secrets are set."
          fi

      - name: Build the signed APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/jobpilot.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          dotnet publish android/src/JobPilot.Mobile -f net10.0-android -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_SIGNING_STORE_PASS \
            -p:AndroidSigningKeyPass=env:ANDROID_SIGNING_KEY_PASS \
            -o "$RUNNER_TEMP/apk"
          rm -f "$keystore"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/apk/com.vidi.jobpilot-Signed.apk" "$RUNNER_TEMP/out/JobPilot-${{ github.run_number }}.apk"

      # Branch pushes: a 14-day artifact for testing. It counts against the account's artifact storage, so a full quota
      # does not fail the build (main publishes a release instead).
      - name: Upload the signed APK
        if: steps.signing.outputs.enabled == 'true' && github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-android-${{ github.run_number }}
          path: ${{ runner.temp }}/out/JobPilot-${{ github.run_number }}.apk
          retention-days: 3
          if-no-files-found: error

      # main: a GitHub release "android-v1.0.<run>" with the signed APK. It is not marked as the latest release, so
      # releases/latest keeps pointing to the Windows installer. Only the 3 newest Android releases are kept.
      - name: Publish the APK as a release
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${{ github.run_number }}"
          tag="android-v$version"
          apk="$RUNNER_TEMP/out/JobSearchCopilot-$version.apk"
          cp "$RUNNER_TEMP/out/JobPilot-${{ github.run_number }}.apk" "$apk"
          notes="APK de JobSearch Copilot para Android 8.0 o superior, versión $version (código ${{ github.run_number }}).

          1. En el teléfono, descargá \`JobSearchCopilot-$version.apk\` (abajo, en Assets).
          2. Abrilo y permití instalar apps de esta fuente si Android lo pide.
          3. Se instala como actualización de una APK anterior de GitHub. No reemplaza una instalación de Google Play (usan otra firma): desinstalá esa primero.

          Commit: ${{ github.sha }}"
          gh release create "$tag" "$apk" --target "${{ github.sha }}" --title "JobSearch Copilot para Android $version" \
            --notes "$notes" --latest=false
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^android-v' | tail -n +4 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
