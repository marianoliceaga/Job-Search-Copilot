name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Personal data check
        run: bash scripts/check-no-personal-data.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore JobPilot.slnx

      - name: Build (warnings are errors)
        run: dotnet build JobPilot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution JobPilot.slnx -c Release --no-build
